<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>汽车零部件表面缺陷检测系统</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif}
  body{background:#f0f4f8;padding:20px}
  .wrap{max-width:1200px;margin:0 auto}
  h1{text-align:center;font-size:22px;margin-bottom:18px;color:#222}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .card h3{font-size:15px;margin-bottom:10px;color:#217ad9;border-left:3px solid #217ad9;padding-left:8px}
  .box{border:2px dashed #bbb;min-height:240px;display:flex;align-items:center;justify-content:center;padding:8px;background:#fafafa}
  .box img{max-width:100%;max-height:240px}
  .btns{display:flex;gap:10px;justify-content:center;margin:14px 0;flex-wrap:wrap}
  button{padding:9px 20px;font-size:14px;border:none;border-radius:6px;background:#217ad9;color:#fff;cursor:pointer}
  button.ghost{background:#888}
  button:disabled{background:#aaa;cursor:not-allowed}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{border:1px solid #ddd;padding:5px 6px;text-align:center}
  th{background:#ecf2f9}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;color:#fff}
  .ok{background:#2e9e5b}.warn{background:#e6a23c}.bad{background:#e34d59}
  #chart1,#chart2{height:260px}
  .full{grid-column:1/3}
  .meta{font-size:13px;color:#555;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <h1>汽车零部件表面缺陷智能检测系统（NEU 数据集）</h1>

  <div class="btns">
    <input type="file" id="fileInput" accept="image/*" hidden>
    <button id="uploadBtn">1. 上传零件图片</button>
    <button id="detectBtn" disabled>2. 开始检测</button>
    <button id="refreshBtn" class="ghost">刷新统计</button>
  </div>

  <div class="grid">
    <div class="card"><h3>原始图像</h3><div class="box" id="inputBox">请上传图片</div></div>
    <div class="card"><h3>检测结果（缺陷框）</h3><div class="box" id="resultBox">等待检测</div></div>
    <div class="card full"><h3>判定信息</h3>
      <div class="meta" id="meta">尚未检测。</div>
    </div>
    <div class="card"><h3>缺陷类型分布</h3><div id="chart1"></div></div>
    <div class="card"><h3>缺陷面积 SPC 控制图</h3><div id="chart2"></div></div>
    <div class="card full"><h3>历史检测记录（最近 20 条）</h3>
      <table><thead><tr>
        <th>#</th><th>时间</th><th>文件名</th><th>缺陷类别</th>
        <th>置信度</th><th>等级</th><th>面积占比</th>
      </tr></thead><tbody id="historyBody"></tbody></table>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let fileData = null, fileName = '';
let chart1 = echarts.init($('chart1')), chart2 = echarts.init($('chart2'));

$('uploadBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  fileName = f.name; fileData = f;
  const r = new FileReader();
  r.onload = ev => {
    $('inputBox').innerHTML = '';
    const img = new Image(); img.src = ev.target.result;
    img.style.maxHeight='240px'; $('inputBox').appendChild(img);
    $('detectBtn').disabled = false;
    $('resultBox').innerText = '点击开始检测';
  };
  r.readAsDataURL(f);
};

$('detectBtn').onclick = async () => {
  if(!fileData) return;
  $('detectBtn').disabled = true;
  $('resultBox').innerText = '检测中...';
  const fd = new FormData(); fd.append('file', fileData);
  try{
    const r = await fetch('/api/detect', {method:'POST', body: fd});
    const d = await r.json();
    $('resultBox').innerHTML = '';
    const img = new Image(); img.src = d.vis_image;
    img.style.maxHeight='240px'; $('resultBox').appendChild(img);
    const sevCls = d.severity==='良品'?'ok':(d.severity==='严重缺陷'?'bad':'warn');
    $('meta').innerHTML = `
      缺陷类别：<b>${d.defect_cn}</b>（${d.defect_class}）　
      置信度：<b>${(d.confidence*100).toFixed(1)}%</b>　
      判定等级：<span class="tag ${sevCls}">${d.severity}</span><br>
      缺陷框数量：${d.bboxes.length}　
      面积占比：${(d.features.area_ratio*100).toFixed(2)}%　
      外接矩形长宽比：${d.features.aspect_ratio.toFixed(2)}`;
    await refreshStats();
  }catch(err){
    $('resultBox').innerText = '检测失败：'+err;
  }finally{
    $('detectBtn').disabled = false;
  }
};

$('refreshBtn').onclick = refreshStats;

async function refreshStats(){
  const s = await (await fetch('/api/stats')).json();
  chart1.setOption({
    tooltip:{},
    xAxis:{type:'category', data:Object.keys(s.by_class||{})},
    yAxis:{type:'value'},
    series:[{type:'bar', data:Object.values(s.by_class||{}),
      itemStyle:{color:'#217ad9'}}]
  });
  const cc = s.control_chart || {};
  chart2.setOption({
    tooltip:{},
    xAxis:{type:'category', data:(cc.points||[]).map((_,i)=>i+1)},
    yAxis:{type:'value'},
    series:[
      {type:'line', data:cc.points||[], name:'面积占比'},
      {type:'line', data:(cc.points||[]).map(()=>cc.ucl),
        name:'UCL', lineStyle:{type:'dashed',color:'#e34d59'}, symbol:'none'},
      {type:'line', data:(cc.points||[]).map(()=>cc.cl),
        name:'CL', lineStyle:{type:'dashed',color:'#888'}, symbol:'none'},
      {type:'line', data:(cc.points||[]).map(()=>cc.lcl),
        name:'LCL', lineStyle:{type:'dashed',color:'#e34d59'}, symbol:'none'},
    ]
  });
  const h = await (await fetch('/api/history?limit=20')).json();
  $('historyBody').innerHTML = h.map(r=>{
    const sc = r.severity==='良品'?'ok':(r.severity==='严重缺陷'?'bad':'warn');
    return `<tr><td>${r.id}</td><td>${r.timestamp}</td><td>${r.image_name||'-'}</td>
      <td>${r.defect_class}</td><td>${(r.confidence*100).toFixed(1)}%</td>
      <td><span class="tag ${sc}">${r.severity}</span></td>
      <td>${((r.defect_area_ratio||0)*100).toFixed(2)}%</td></tr>`;
  }).join('');
}
refreshStats();
window.onresize = ()=>{chart1.resize();chart2.resize();};
</script>
</body>
</html>
